<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US Job Market 2026 — 3-D map</title>
<script src="vendor/d3.v7.min.js"></script>
<style>
  :root { --fg:#1b1b1b; --muted:#5f5f5c; --bg:#f3f3ef; --panel:#ffffff; --line:#dddcd6; --ok:#1f7a3a; --bad:#b3261e; --accent:#3b5bdb; --grey:#b9b9b3;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --serif:Georgia,"Times New Roman",serif; }
  @media (prefers-color-scheme: dark) { :root { --fg:#ececea; --muted:#a3a39f; --bg:#141414; --panel:#1e1e1e; --line:#333; --ok:#5ec47a; --bad:#f0756b; --accent:#7b93ff; --grey:#55554f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 16px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 30px; margin: 0 0 6px; }
  .lede { color: var(--muted); max-width: 70rem; margin: 0 0 14px; line-height: 1.5; }
  .tiles { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .tile .l { font-size:12px; color:var(--muted); } .tile .v { font-family:var(--serif); font-size:26px; line-height:1.15; margin:3px 0 2px; } .tile .n { font-size:11px; color:var(--muted); }
  .layout { display:grid; grid-template-columns: minmax(0, 2.2fr) minmax(280px, 1fr); gap: 14px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; }
  .card h2 { font-size:16px; font-weight:600; margin:0 0 4px; }
  .note { font-size:12px; color:var(--muted); margin:0 0 8px; line-height:1.45; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; vertical-align:middle; }
  .seg button { all:unset; cursor:pointer; padding:4px 10px; font-size:12px; color:var(--muted); } .seg button.on { background:var(--muted); color:var(--panel); }
  .ctl { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; font-size:12px; color:var(--muted); margin: 6px 0 8px; }
  .ctl input[type=range] { width:7rem; margin:0; accent-color: var(--muted); }
  .ctl button.plain { all:unset; cursor:pointer; border:1px solid var(--line); border-radius:8px; padding:3px 8px; }
  .chapters { display:flex; flex-wrap:wrap; gap:6px; margin: 0 0 8px; }
  .chapters button { all:unset; cursor:pointer; border:1px solid var(--line); border-radius:999px; padding:4px 11px; font-size:12px; color:var(--fg); background:var(--panel); }
  .chapters button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .mapbox { position:relative; } #map svg { cursor:grab; } #map svg:active { cursor:grabbing; }
  .tip { position:absolute; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.16); padding:6px 9px; font-size:12px; pointer-events:none; display:none; max-width:20rem; z-index:3; line-height:1.4; }
  .tip .t { color:var(--muted); } .up { color:var(--ok); } .down { color:var(--bad); }
  .legend { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-top:8px; flex-wrap:wrap; }
  .legend .bar { flex:0 0 10rem; height:10px; border-radius:5px; }
  .story { font-size:13px; line-height:1.5; margin: 8px 0 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); border-radius: 0 8px 8px 0; }
  .hubs { list-style:none; margin:0; padding:0; }
  .hubs li { padding:8px 6px; border-bottom:1px solid var(--line); cursor:pointer; border-radius:6px; }
  .hubs li:hover, .hubs li.on { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .hubs .r { display:inline-block; width:1.6em; font-family:var(--serif); font-size:16px; color:var(--muted); }
  .hubs .h { font-weight:600; } .hubs .s { font-size:12px; color:var(--muted); display:block; margin-top:2px; }
  table { width:100%; border-collapse:collapse; font-size:12px; } th { text-align:left; color:var(--muted); font-weight:600; padding:5px 6px 5px 0; border-bottom:1px solid var(--line); white-space:nowrap; } td { padding:5px 6px 5px 0; border-bottom:1px solid var(--line); } td.num, th.num { text-align:right; white-space:nowrap; }
  .foot { font-size:12px; color:var(--muted); margin-top:14px; line-height:1.5; }
  .foot a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>US job market, 2026 — a 3-D map</h1>
  <p class="lede" id="lede">Loading…</p>

  <div class="tiles" id="tiles"></div>

  <div class="layout">
    <div class="card">
      <div class="chapters" id="chapters"></div>
      <div class="story" id="story"></div>
      <div class="ctl">
        <span>Layer:</span>
        <span class="seg" id="layer-seg">
          <button data-l="unemp" class="on">Unemployment rate</button>
          <button data-l="uchg">Change vs. year ago</button>
          <button data-l="jobs">Job growth, 12 mo</button>
          <button data-l="geo">Geospatial hubs</button>
        </span>
        <label><input type="checkbox" id="show-hubs" checked> hub markers</label>
        <label><input type="checkbox" id="show-metros"> metro markers</label>
      </div>
      <div class="ctl">
        <span>Drag to move · scroll to zoom · Shift+drag to rotate/tilt</span>
        <label>Rotate <input type="range" id="rot" min="-180" max="180" value="0"></label>
        <label>Tilt <input type="range" id="tilt" min="25" max="100" value="80"></label>
        <button class="plain" id="reset">Reset view</button>
      </div>
      <div class="mapbox"><div id="map" style="min-height:520px"></div><div class="tip" id="tip"></div></div>
      <div class="legend"><span id="lg-lo">—</span><span class="bar" id="lg-bar"></span><span id="lg-hi">—</span><span id="lg-note"></span></div>
    </div>
    <div>
      <div class="card" style="margin-bottom:14px">
        <h2>Where geospatial careers cluster</h2>
        <p class="note">Ranked for a geospatial graduate: employment base, pay after rent, 2025–26 employer momentum, metro health. Click a hub to focus it.</p>
        <ul class="hubs" id="hublist"></ul>
      </div>
      <div class="card">
        <h2 id="tbl-title">States ranked</h2>
        <p class="note" id="tbl-note"></p>
        <div style="max-height:22rem;overflow:auto"><table id="tbl"><thead></thead><tbody></tbody></table></div>
      </div>
    </div>
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const num = v => (v === '' || v == null) ? NaN : Number(v);
  const f1 = v => isNaN(v) ? '—' : d3.format('.1f')(v);
  const fp = v => isNaN(v) ? '—' : (v > 0 ? '+' : '') + d3.format('.1f')(v) + '%';
  const fk = v => isNaN(v) ? '—' : (v > 0 ? '+' : '') + d3.format(',.0f')(v * 1000);
  const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const proj = d3.geoAlbersUsa().scale(1300).translate([487.5, 305]);
  const monthName = p => { const [y, m] = p.split('-'); return new Date(Date.UTC(+y, +m - 1, 1)).toLocaleString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' }); };

  const D = {};
  const load = (k, f) => fetch('data/' + f).then(r => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.text(); }).then(t => { D[k] = f.endsWith('.json') ? JSON.parse(t) : d3.csvParse(t); });
  Promise.all([load('geo', 'states_geo.json'), load('states', 'states.csv'), load('hubs', 'hubs.csv'), load('metros', 'metros.csv'), load('nat', 'national.csv')]).then(init).catch(e => { $('lede').textContent = 'Data failed to load: ' + e.message; });

  const LAYERS = {
    unemp: { title: 'Unemployment rate', field: 'unemployment_rate', fmt: v => f1(v) + '%', kind: 'seq', note: 'Height and color = unemployment rate; lower is better' },
    uchg:  { title: 'Change in unemployment vs. a year ago', field: 'unemployment_change_pts', fmt: v => (v > 0 ? '+' : '') + f1(v) + ' pt', kind: 'div', invert: true, note: 'Green = rate fell (sinks below the plane); red = rate rose' },
    jobs:  { title: 'Nonfarm job growth, 12 months', field: 'jobs_change_12mo_pct', fmt: v => fp(v), kind: 'div', note: 'Green rises, red sinks; grey = not statistically significant / not yet loaded' },
    geo:   { title: 'Geospatial hubs', field: null, kind: 'hubs', note: 'States flat and grey; marker height and size = hub score from the research report' },
  };
  const CHAPTERS = [
    { id: 'c1', label: '1 · A stalled market', layer: 'unemp', hubs: false, text: 'Unemployment has sat between 4.1% and 4.3% since March 2026, yet payrolls grew only 29,000 in September. It is a "low-hire, low-fire" market: few layoffs, but hiring plans at a 15-year low and wages trailing inflation. The Dakotas, New England and the Plains are tightest; DC, California, Michigan and Connecticut loosest.' },
    { id: 'c2', label: '2 · Where jobs grow', layer: 'jobs', hubs: false, metros: true, text: 'Only seven states and nine of 387 metros added jobs at a statistically significant pace over the year: Texas (+154,300), California, North Carolina and Minnesota in numbers; South Carolina, Louisiana and Utah in percent. Houston, Minneapolis, Charlotte, Salt Lake City and Raleigh are the metro winners — the South and Mountain West, and the suburbs more than the cores.' },
    { id: 'c3', label: '3 · Where they shrink', layer: 'uchg', hubs: false, metros: true, text: 'Washington DC is the only jurisdiction in outright decline (−25,800 jobs, −3.5%; the metro −66,000) after 2025 federal workforce cuts, and Portland is the other large loser. Unemployment rose most in Connecticut, Alabama, Hawaii, Oklahoma, Arizona and New Mexico, while Ohio, Pennsylvania and New Jersey improved sharply.' },
    { id: 'c4', label: '4 · Geospatial hubs', layer: 'geo', hubs: true, text: 'For geospatial careers the federal reshuffle matters more than the headline: NGA\'s $1.7B St. Louis campus opened in October 2025, Space Command and FBI jobs are moving to Huntsville, USDA is dispersing to Raleigh, Kansas City, Indianapolis, Fort Collins and Salt Lake City, while civil science agencies and DC civil contractors cut. Hover a marker for the case for each hub.' },
  ];

  let layer = 'unemp', chapter = 'c1', focusHub = null; const view = { rot: 0, tilt: 0.8 }; let zoomT = d3.zoomIdentity;

  function init() {
    const st = D.states; const nat = D.nat; const period = st[0].period;
    const byName = new Map(st.map(r => [r.state, r]));
    $('lede').textContent = `State unemployment and job growth through ${monthName(period)} (BLS), national figures from the latest releases, and the ten metros where geospatial work concentrates, drawn from a research review completed October 24, 2026. Raised states and markers are the data; rotate, tilt and zoom the map to read it from any angle.`;
    $('tiles').innerHTML = nat.map(r => `<div class="tile"><div class="l">${esc(r.metric)}</div><div class="v">${esc(r.value)}<span style="font-size:14px;color:var(--muted)"> ${esc(r.unit)}</span></div><div class="n">${esc(r.asof)} · ${esc(r.note)}</div></div>`).join('');
    $('chapters').innerHTML = CHAPTERS.map(c => `<button data-c="${c.id}" class="${c.id === chapter ? 'on' : ''}">${esc(c.label)}</button>`).join('');
    $('chapters').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { const c = CHAPTERS.find(x => x.id === b.dataset.c); chapter = c.id; layer = c.layer; $('show-hubs').checked = !!c.hubs; $('show-metros').checked = !!c.metros; sync(); }));
    $('layer-seg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { layer = b.dataset.l; chapter = null; sync(); }));
    ['show-hubs', 'show-metros'].forEach(id => $(id).addEventListener('change', render));
    $('rot').addEventListener('input', e => { view.rot = +e.target.value; if (renderFrame) renderFrame(); });
    $('tilt').addEventListener('input', e => { view.tilt = +e.target.value / 100; if (renderFrame) renderFrame(); });
    $('reset').addEventListener('click', () => { view.rot = 0; view.tilt = 0.8; zoomT = d3.zoomIdentity; render(); });
    $('hublist').innerHTML = D.hubs.map(h => `<li data-h="${esc(h.hub)}"><span class="r">${esc(h.rank)}</span><span class="h">${esc(h.hub)}</span>, ${esc(h.state)}<span class="s">${esc(h.summary)}</span></li>`).join('');
    $('hublist').querySelectorAll('li').forEach(li => li.addEventListener('click', () => { focusHub = focusHub === li.dataset.h ? null : li.dataset.h; layer = 'geo'; chapter = null; $('show-hubs').checked = true; sync(); }));
    const src = new Set(st.map(r => r.source)); $('foot').innerHTML = `Sources: ${Array.from(src).map(esc).join('; ')}; BLS Metropolitan Area Employment (Aug 2026); BLS OEWS May 2023 metro tables (cartographers & photogrammetrists, SOC 17-1021); Apartment List rents (Oct 2026); NAR/HSH home prices (Q1 2026); and the research report "Geospatial job market geography 2026" (Oct 24, 2026). The state layers refresh monthly from the BLS public API via GitHub Actions; the hub ranking is editorial and updated by hand. Not career or investment advice.`;
    window.addEventListener('resize', () => render());
    sync();
  }

  function sync() {
    $('chapters').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.c === chapter));
    $('layer-seg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.l === layer));
    $('hublist').querySelectorAll('li').forEach(li => li.classList.toggle('on', li.dataset.h === focusHub));
    const c = CHAPTERS.find(x => x.id === chapter);
    $('story').style.display = c ? '' : 'none'; if (c) $('story').textContent = c.text;
    render(); table();
  }

  function table() {
    const L = LAYERS[layer]; const st = D.states.slice();
    const field = L.field || 'unemployment_rate';
    const rows = st.filter(r => !isNaN(num(r[field]))).sort((a, b) => (L.kind === 'seq' ? num(a[field]) - num(b[field]) : num(b[field]) - num(a[field])));
    $('tbl-title').textContent = (L.field ? L.title : 'Unemployment rate') + ' — states ranked';
    $('tbl-note').textContent = L.kind === 'seq' ? 'Lowest first.' : L.field ? 'Best first; states without a significant figure are omitted.' : 'Lowest first.';
    $('tbl').querySelector('thead').innerHTML = '<tr><th>#</th><th>State</th><th class="num">Unemp.</th><th class="num">vs yr ago</th><th class="num">Jobs 12 mo</th></tr>';
    $('tbl').querySelector('tbody').innerHTML = rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.state)}</td><td class="num">${f1(num(r.unemployment_rate))}%</td><td class="num ${cls(-num(r.unemployment_change_pts))}">${(num(r.unemployment_change_pts) > 0 ? '+' : '') + f1(num(r.unemployment_change_pts))}</td><td class="num ${cls(num(r.jobs_change_12mo_pct))}">${isNaN(num(r.jobs_change_12mo_pct)) ? '—' : fp(num(r.jobs_change_12mo_pct)) + (r.jobs_change_12mo_thousands !== '' ? ' (' + fk(num(r.jobs_change_12mo_thousands)) + ')' : '')}</td></tr>`).join('');
  }

  let renderFrame = null;
  function render() {
    const box = $('map'), tip = $('tip'); box.innerHTML = '';
    const L = LAYERS[layer]; const byName = new Map(D.states.map(r => [r.state, r]));
    const W = box.clientWidth || 900; const PAD = 120, VW = 1060, VH = 610 + PAD, XOFF = 90; const H = Math.round(W * VH / VW); box.style.minHeight = H + 'px';
    const ok = css('--ok'), bad = css('--bad'), grey = css('--grey'), accent = css('--accent');
    const val = r => !r || !L.field ? NaN : num(r[L.field]);
    const vals = D.states.map(val).filter(v => !isNaN(v));
    let hScale, color, lgLo, lgHi;
    if (L.kind === 'seq') { const [lo, hi] = d3.extent(vals); hScale = d3.scaleLinear([lo, hi], [4, 90]); const ramp = d3.interpolateRgb(ok, bad); color = v => isNaN(v) ? grey : ramp((v - lo) / (hi - lo)); lgLo = `${f1(lo)}%`; lgHi = `${f1(hi)}%`; $('lg-bar').style.background = `linear-gradient(90deg, ${ok}, ${bad})`; }
    else if (L.kind === 'div') { const m = d3.max(vals, v => Math.abs(v)) || 1; hScale = d3.scaleLinear([0, m], [0, 90]); const up = d3.interpolateRgb(grey, ok), dn = d3.interpolateRgb(grey, bad); const sgn = L.invert ? -1 : 1; color = v => isNaN(v) ? grey : (v * sgn >= 0 ? up(Math.min(1, Math.abs(v) / m)) : dn(Math.min(1, Math.abs(v) / m))); lgLo = L.fmt(-m); lgHi = L.fmt(m); $('lg-bar').style.background = L.invert ? `linear-gradient(90deg, ${ok}, ${grey}, ${bad})` : `linear-gradient(90deg, ${bad}, ${grey}, ${ok})`; }
    else { hScale = () => 0; color = () => grey; lgLo = 'Hub score 50'; lgHi = '100'; $('lg-bar').style.background = `linear-gradient(90deg, ${grey}, ${accent})`; }
    $('lg-lo').textContent = lgLo; $('lg-hi').textContent = lgHi; $('lg-note').textContent = '· ' + L.note;

    const svg = d3.select(box).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${VW} ${VH}`).style('display', 'block');
    const gView = svg.append('g'); const gStates = gView.append('g'); const gMarks = gView.append('g'); const gLabels = gView.append('g').style('pointer-events', 'none');
    const CX = 487.5, CY = 305;
    const plane = () => { const a = view.rot * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), tl = view.tilt; return { a: c, b: s * tl, c: -s, d: c * tl, e: VW / 2 - (c * CX - s * CY), f: VH / 2 + 30 - (s * CX + c * CY) * tl }; };
    const items = D.geo.map(s => { const r = byName.get(s.name); const v = val(r); let h = 0;
      if (L.kind === 'seq') h = isNaN(v) ? 0 : Math.round(hScale(v)); else if (L.kind === 'div') { const sgn = L.invert ? -1 : 1; h = isNaN(v) ? 0 : Math.round(hScale(Math.abs(v))) * (v * sgn >= 0 ? 1 : -1); }
      const top = color(v); const dc = d3.color(top); return { s, r, v, h, top, side: dc ? dc.darker(h < 0 ? 1.5 : 0.9).formatRgb() : top }; });
    const gs = gStates.selectAll('g.state').data(items, d => d.s.id).join('g').attr('class', 'state');
    gs.each(function (d) { const g1 = d3.select(this); const ks = []; if (d.h >= 0) { for (let k = Math.max(0, d.h - 1); k >= 0; k -= 2) ks.push(k); } else { for (let k = -1; k > d.h; k -= 2) ks.push(k); }
      let holder = g1; if (d.h < 0) { g1.append('clipPath').attr('id', 'pit-' + d.s.id).attr('clipPathUnits', 'userSpaceOnUse').append('path').attr('class', 'clipbase').attr('d', d.s.path); holder = g1.append('g').attr('clip-path', `url(#pit-${d.s.id})`); }
      holder.selectAll('path.side').data(ks).join('path').attr('class', 'side').attr('d', d.s.path).attr('fill', d.side);
      holder.append('path').attr('class', 'face').attr('d', d.s.path).attr('fill', d.top).attr('stroke', css('--bg')).attr('stroke-width', 0.7).attr('stroke-linejoin', 'round');
      if (d.h < 0) g1.append('path').attr('class', 'rim').attr('d', d.s.path).attr('fill', 'none').attr('stroke', css('--bg')).attr('stroke-width', 0.7); });
    gs.on('mousemove', (ev, d) => { const rb = box.getBoundingClientRect(); const r = d.r || {};
      showTip(tip, box, ev.clientX - rb.left, ev.clientY - rb.top, `<div class="t">${esc(d.s.name)} · ${esc(r.period ? monthName(r.period) : '')}</div><div>Unemployment <b>${f1(num(r.unemployment_rate))}%</b> <span class="${cls(-num(r.unemployment_change_pts))}">(${(num(r.unemployment_change_pts) > 0 ? '+' : '') + f1(num(r.unemployment_change_pts))} pt vs. year ago)</span></div><div>Jobs, 12 mo: <span class="${cls(num(r.jobs_change_12mo_pct))}">${isNaN(num(r.jobs_change_12mo_pct)) ? 'not significant / pending' : fp(num(r.jobs_change_12mo_pct)) + (r.jobs_change_12mo_thousands !== '' ? ' (' + fk(num(r.jobs_change_12mo_thousands)) + ')' : '')}</span></div>`); })
      .on('mouseleave', () => tip.style.display = 'none');
    // labels
    const labels = items.filter(d => { const bb = gs.filter(x => x === d).select('path.face').node().getBBox(); d.bb = bb; return bb.width > 30 && bb.height > 18; })
      .map(d => ({ d, abbr: d.s.abbr, value: (d.bb.width > 46 && d.bb.height > 34 && L.field && !isNaN(d.v)) ? L.fmt(d.v) : '' }));
    const lab = gLabels.selectAll('g').data(labels).join('g');
    lab.append('text').attr('dy', d => d.value ? '-0.2em' : '0.35em').attr('text-anchor', 'middle').attr('font-size', '10px').attr('font-weight', '600').attr('fill', css('--fg')).text(d => d.abbr);
    lab.filter(d => d.value).append('text').attr('dy', '0.95em').attr('text-anchor', 'middle').attr('font-size', '9px').attr('fill', css('--fg')).attr('fill-opacity', .85).text(d => d.value);
    // markers: hubs (pins whose height = score) and metros (dots)
    const hubsOn = $('show-hubs').checked, metrosOn = $('show-metros').checked;
    const stateH = name => { const it = items.find(i => i.s.name === name); return it ? Math.max(0, it.h) : 0; };
    const marks = [];
    if (hubsOn) D.hubs.forEach(h => { const p = proj([num(h.lon), num(h.lat)]); if (!p) return; marks.push({ kind: 'hub', x: p[0], y: p[1], base: stateH(h.state), hgt: Math.round((num(h.geo_score) - 40) * 1.6), r: 4 + (num(h.geo_score) - 50) / 8, d: h, focus: focusHub === h.hub, dim: focusHub && focusHub !== h.hub }); });
    if (metrosOn) D.metros.forEach(m => { const p = proj([num(m.lon), num(m.lat)]); if (!p) return; const g = num(m.jobs_change_12mo_pct), n = num(m.jobs_change_12mo); const good = !isNaN(g) ? g > 0 : !isNaN(n) ? n > 0 : null; marks.push({ kind: 'metro', x: p[0], y: p[1], base: stateH(m.state), hgt: 0, r: 4, d: m, good }); });
    const mk = gMarks.selectAll('g.mk').data(marks).join('g').attr('class', 'mk').style('cursor', 'pointer');
    mk.filter(d => d.kind === 'hub').each(function (d) { const g = d3.select(this); g.append('line').attr('class', 'pin').attr('stroke', accent).attr('stroke-width', d.focus ? 3 : 2).attr('stroke-opacity', d.dim ? .35 : .9);
      g.append('circle').attr('class', 'head').attr('r', d.r).attr('fill', accent).attr('fill-opacity', d.dim ? .35 : .95).attr('stroke', '#fff').attr('stroke-width', d.focus ? 2.5 : 1.2);
      g.append('text').attr('class', 'hl').attr('font-size', d.focus ? '12px' : '10px').attr('font-weight', '600').attr('fill', css('--fg')).attr('fill-opacity', d.dim ? .4 : 1).text(`${d.d.rank}. ${d.d.hub}`); });
    mk.filter(d => d.kind === 'metro').each(function (d) { const g = d3.select(this); g.append('circle').attr('class', 'head').attr('r', 4.5).attr('fill', d.good === null ? grey : d.good ? ok : bad).attr('stroke', '#fff').attr('stroke-width', 1.2); });
    mk.on('mousemove', (ev, d) => { const rb = box.getBoundingClientRect();
      const html = d.kind === 'hub' ? `<div class="t">#${esc(d.d.rank)} geospatial hub · score ${esc(d.d.geo_score)}</div><div><b>${esc(d.d.hub)}</b>, ${esc(d.d.state)}</div><div>${esc(d.d.summary)}</div><div style="margin-top:4px"><b>Momentum:</b> ${esc(d.d.momentum)}</div><div><b>Metro jobs 2026:</b> ${esc(d.d.metro_jobs_signal_2026)}</div>${d.d.cartographer_jobs_2023 ? `<div><b>Cartographer jobs / mean wage (May 2023):</b> ${esc(d.d.cartographer_jobs_2023)} / $${d3.format(',')(num(d.d.cartographer_mean_wage_2023))}</div>` : ''}<div><b>Rent (Oct 2026):</b> $${d3.format(',')(num(d.d.rent_oct2026))}${d.d.home_price_to_wage ? ` · <b>home price ÷ wage:</b> ${esc(d.d.home_price_to_wage)}×` : ''}</div>`
        : `<div class="t">Metro · ${esc(d.d.state)}</div><div><b>${esc(d.d.metro)}</b></div><div>${!isNaN(num(d.d.jobs_change_12mo)) ? 'Jobs, 12 mo: <b>' + fk(num(d.d.jobs_change_12mo) / 1000) + '</b>' : ''}${!isNaN(num(d.d.jobs_change_12mo_pct)) ? ' <b>' + fp(num(d.d.jobs_change_12mo_pct)) + '</b>' : ''}${!isNaN(num(d.d.unemployment_aug2026)) ? ' · unemployment ' + f1(num(d.d.unemployment_aug2026)) + '%' : ''}</div><div>${esc(d.d.note)}</div>`;
      showTip(tip, box, ev.clientX - rb.left, ev.clientY - rb.top, html); }).on('mouseleave', () => tip.style.display = 'none');
    mk.filter(d => d.kind === 'hub').on('click', (ev, d) => { focusHub = focusHub === d.d.hub ? null : d.d.hub; sync(); });

    const render2 = () => {
      const m = plane(); const ms = `matrix(${m.a} ${m.b} ${m.c} ${m.d} ${m.e} ${m.f})`;
      const depth = d => Math.sin(view.rot * Math.PI / 180) * d.s.cx + Math.cos(view.rot * Math.PI / 180) * d.s.cy;
      gs.sort((a, b) => depth(a) - depth(b));
      gs.selectAll('path.side').attr('transform', k => `translate(0,${-k}) ${ms}`);
      gs.select('path.face').attr('transform', d => `translate(0,${-d.h}) ${ms}`);
      gs.selectAll('path.clipbase, path.rim').attr('transform', ms);
      const P = (x, y, h) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f - h];
      lab.attr('transform', d => { const [x, y] = P(d.d.s.cx, d.d.s.cy, d.d.h); return `translate(${x},${y})`; });
      const mdepth = d => Math.sin(view.rot * Math.PI / 180) * d.x + Math.cos(view.rot * Math.PI / 180) * d.y;
      mk.sort((a, b) => mdepth(a) - mdepth(b));
      mk.each(function (d) { const g = d3.select(this); const [x0, y0] = P(d.x, d.y, d.base); const [x1, y1] = P(d.x, d.y, d.base + d.hgt);
        g.select('line.pin').attr('x1', x0).attr('y1', y0).attr('x2', x1).attr('y2', y1);
        g.select('circle.head').attr('cx', x1).attr('cy', y1);
        g.select('text.hl').attr('x', x1 + d.r + 3).attr('y', y1 + 3); });
      $('rot').value = Math.round(view.rot); $('tilt').value = Math.round(view.tilt * 100);
    };
    renderFrame = render2; render2();
    const zoom = d3.zoom().scaleExtent([0.5, 6]).filter(ev => !ev.shiftKey && !ev.button).on('zoom', ev => { zoomT = ev.transform; gView.attr('transform', zoomT); });
    svg.call(zoom); svg.call(zoom.transform, zoomT);
    svg.on('mousedown.rotate', ev => { if (!ev.shiftKey) return; ev.preventDefault(); const st = { x: ev.clientX, y: ev.clientY, rot: view.rot, tilt: view.tilt }; tip.style.display = 'none';
      const mv = e => { view.rot = ((st.rot + (e.clientX - st.x) * 0.5 + 540) % 360) - 180; view.tilt = Math.max(0.25, Math.min(1, st.tilt - (e.clientY - st.y) * 0.004)); render2(); };
      const up = () => { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
      window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up); });
  }
  function showTip(tip, box, x, y, html) { tip.innerHTML = html; tip.style.display = 'block'; const r = box.getBoundingClientRect(); const w = tip.offsetWidth, h = tip.offsetHeight; let left = x + 12, top = y + 12; if (left + w > r.width) left = Math.max(0, x - w - 12); if (top + h > r.height) top = Math.max(0, y - h - 12); tip.style.left = left + 'px'; tip.style.top = top + 'px'; }
})();
